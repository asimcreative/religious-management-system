; =================================================================
; RAMS — PHP Runtime Configuration
; Applied via $PHP_INI_DIR/conf.d/rams.ini
; =================================================================

[PHP]
; -----------------------------------------------------------------
; Memory
; -----------------------------------------------------------------
memory_limit = 256M

; -----------------------------------------------------------------
; File uploads (Excel imports, PDF uploads, etc.)
; Match nginx client_max_body_size
; -----------------------------------------------------------------
upload_max_filesize = 64M
post_max_size       = 64M
max_file_uploads    = 20

; -----------------------------------------------------------------
; Execution limits
; Increased for bulk Excel exports and report generation
; -----------------------------------------------------------------
max_execution_time = 300
max_input_time     = 300
max_input_vars     = 5000

; -----------------------------------------------------------------
; Error handling
; Display off in production — errors go to storage/logs/
; -----------------------------------------------------------------
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------------------
; Timezone (override per .env APP_TIMEZONE if needed)
; -----------------------------------------------------------------
date.timezone = UTC

; -----------------------------------------------------------------
; Session (managed by Redis — config in config/session.php)
; -----------------------------------------------------------------
session.gc_maxlifetime = 7200

; -----------------------------------------------------------------
; OPcache — production settings
; validate_timestamps = 0: never check mtime (fastest; requires
;   opcache.reset or container restart after code changes)
; -----------------------------------------------------------------
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.revalidate_freq        = 0
opcache.validate_timestamps    = 0
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
opcache.jit_buffer_size        = 100M
opcache.jit                    = tracing

; -----------------------------------------------------------------
; Realpath cache — speeds up file includes
; -----------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl  = 600