# =================================================================
# RAMS — Nginx configuration
# Served from the nginx:1.27-alpine container.
#
# Static assets: served directly from app_public volume
# PHP requests:  proxied to app:9000 (PHP-FPM)
# =================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ---------------------------------------------------------------
    # Upload size — match php.ini upload_max_filesize
    # ---------------------------------------------------------------
    client_max_body_size 64M;

    # ---------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"                always;
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-XSS-Protection          "1; mode=block"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # Static asset caching
    # Vite-compiled assets have hashed filenames — safe to cache long.
    # ---------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # ---------------------------------------------------------------
    # Favicon / robots — suppress log noise
    # ---------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---------------------------------------------------------------
    # Laravel health check (built-in /up endpoint)
    # ---------------------------------------------------------------
    location = /up {
        try_files $uri /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass              app:9000;
        fastcgi_index             index.php;
        include                   fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
    }

    # ---------------------------------------------------------------
    # Main routing — try static file, then PHP
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------
    # PHP-FPM — forward .php requests to app container
    # ---------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info       ^(.+\.php)(/.+)$;
        fastcgi_pass                  app:9000;
        fastcgi_index                 index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTP_PROXY      "";     # Mitigate HTTPoxy vulnerability

        # Timeouts — increase for long-running reports / exports
        fastcgi_read_timeout          300;
        fastcgi_connect_timeout       60;
        fastcgi_send_timeout          300;

        # Buffers
        fastcgi_buffers               16 16k;
        fastcgi_buffer_size           32k;
    }

    # ---------------------------------------------------------------
    # Deny access to hidden files (.env, .git, etc.)
    # ---------------------------------------------------------------
    location ~ /\. {
        deny all;
    }

    # ---------------------------------------------------------------
    # Deny direct access to sensitive directories
    # ---------------------------------------------------------------
    location ~ ^/(storage|bootstrap)/ {
        deny all;
    }

    # ---------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------
    error_log  /var/log/nginx/rams_error.log;
    access_log /var/log/nginx/rams_access.log;
}
