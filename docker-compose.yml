# =================================================================
# Religious Affairs Management System (RAMS)
# Docker Compose — Full stack
#
# Services:
#   app       — PHP 8.4-FPM (Laravel application)
#   nginx     — Web server (port 80)
#   mysql     — MySQL 8 database (port 3306)
#   redis     — Redis 7 (cache, sessions, queues) (port 6379)
#   horizon   — Laravel Horizon (queue manager)
#   scheduler — Laravel task scheduler
#
# Quick start:
#   cp .env.docker .env        # configure environment
#   docker compose up -d       # start all services
#   docker compose logs -f     # follow logs
# =================================================================

# Shared base for all PHP containers (app, horizon, scheduler)
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  image: rams-app:latest
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - rams_network

services:

  # ---------------------------------------------------------------
  # PHP-FPM Application
  # Runs the entrypoint which:
  #   1. Populates the public volume (first run only)
  #   2. Runs php artisan package:discover
  #   3. Runs php artisan optimize
  #   4. Runs php artisan migrate --force
  #   5. Creates storage symlink
  #   6. Starts php-fpm as www
  # ---------------------------------------------------------------
  app:
    <<: *app-base
    container_name: rams_app
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    healthcheck:
      # Port 9000 only opens after entrypoint init is complete
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s    # Allow time for migrations on first run

  # ---------------------------------------------------------------
  # Nginx 1.27 — Web server
  # Serves static assets from the shared app_public volume.
  # Proxies PHP requests to app:9000.
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: rams_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    networks:
      - rams_network

  # ---------------------------------------------------------------
  # MySQL 8.0
  # Database is created automatically using DB_DATABASE / DB_USERNAME
  # / DB_PASSWORD from your .env file.
  # MYSQL_ROOT_PASSWORD must also be set (see .env.docker).
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: rams_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rams}
      MYSQL_USER: ${DB_USERNAME:-rams}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - "127.0.0.1"
        - -u
        - root
        - --password=${MYSQL_ROOT_PASSWORD:-rootsecret}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rams_network

  # ---------------------------------------------------------------
  # Redis 7 — Cache, Sessions, Queues
  # Persistence: AOF (appendonly yes)
  # For production: set REDIS_PASSWORD in .env and add
  #   --requirepass ${REDIS_PASSWORD} to the command.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rams_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rams_network

  # ---------------------------------------------------------------
  # Laravel Horizon — Queue manager + dashboard (/horizon)
  # Uses the same image as app. Entrypoint detects the command
  # is NOT php-fpm, so it skips init and starts Horizon directly.
  # ---------------------------------------------------------------
  horizon:
    <<: *app-base
    container_name: rams_horizon
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "horizon"]

  # ---------------------------------------------------------------
  # Laravel Scheduler — Runs artisan schedule:work
  # Replaces the traditional cron entry. Executes scheduled tasks
  # defined in bootstrap/app.php → withSchedule().
  # ---------------------------------------------------------------
  scheduler:
    <<: *app-base
    container_name: rams_scheduler
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "schedule:work"]

# -----------------------------------------------------------------
# Named volumes
# -----------------------------------------------------------------
volumes:
  # MySQL database files
  mysql_data:
    driver: local

  # Redis AOF persistence
  redis_data:
    driver: local

  # Laravel storage (logs, uploads, sessions, compiled views)
  app_storage:
    driver: local

  # Laravel bootstrap/cache (config, routes, views cache)
  app_bootstrap_cache:
    driver: local

  # Public web root — shared between app (write) and nginx (read)
  # Populated by entrypoint.sh on first container start.
  app_public:
    driver: local

# -----------------------------------------------------------------
# Networks
# -----------------------------------------------------------------
networks:
  rams_network:
    driver: bridge
